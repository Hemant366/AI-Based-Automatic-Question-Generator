services:
  - type: web
    name: ai-question-generator-backend
    env: node
    plan: free
    branch: main
    permissions:
      contents: write  # Allow writing to repository contents
      pages: write
      id-token: write
    root: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
